<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>🔑 Reset Password</h1>

            <form method="POST">

                <input
                    type="text"
                    name="username"
                    placeholder="Enter Username"
                    required
                >

                <input
                    type="password"
                    name="new_password"
                    placeholder="Enter New Password"
                    required
                >

                <button type="submit">

                    Update Password

                </button>

            </form>


            

            {% if error %}

                <p class="error">

                    {{ error }}

                </p>

            {% endif %}


            

            <div class="links">

                <a href="/login">

                    Back to Login

                </a>

            </div>

        </div>

    </div>

</body>

</html>
