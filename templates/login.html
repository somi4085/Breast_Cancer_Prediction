<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1> Login</h1>

            <form method="POST">

                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">

                    Login

                </button>

            </form>

            <div class="links">

                <a href="/register">

                    Create Account

                </a>

                <a href="/forgot-password">

                    Forgot Password?

                </a>

            </div>


            

            {% if error %}

                <p class="error">

                    {{ error }}

                </p>

            {% endif %}

        </div>

    </div>

</body>

</html>
